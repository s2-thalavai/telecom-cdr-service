# Prod-like local stack: MySQL 8.4 + telecom-cdr-service (prod profile, Flyway, JDBC batch inserts).
name: telecom-cdr

services:
  mysql:
    image: mysql:8.4
    container_name: telecom-cdr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-telecomdb}
      MYSQL_USER: ${MYSQL_USER:-telecom_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-telecom_pass_change_me}
      TZ: UTC
    command: ["--innodb-buffer-pool-size=512M", "--max-allowed-packet=64M"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: telecom-cdr-service:1.0.0
    container_name: telecom-cdr-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-telecomdb}
      DB_USERNAME: ${MYSQL_USER:-telecom_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-telecom_pass_change_me}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      TELECOM_SPOOL_DIRECTORY: /app/data/spool
      TELECOM_PAYLOAD_DEFAULT_MAX_REQUEST_SIZE: ${TELECOM_PAYLOAD_DEFAULT_MAX_REQUEST_SIZE:-10MB}
      TELECOM_PAYLOAD_STREAMING_MAX_REQUEST_SIZE: ${TELECOM_PAYLOAD_STREAMING_MAX_REQUEST_SIZE:-500MB}
      TELECOM_PAYLOAD_MAX_DECOMPRESSED_SIZE: ${TELECOM_PAYLOAD_MAX_DECOMPRESSED_SIZE:-2GB}
      TELECOM_PAYLOAD_CHUNK_SIZE: ${TELECOM_PAYLOAD_CHUNK_SIZE:-1000}
      TELECOM_PAYLOAD_ASYNC_WORKERS: ${TELECOM_PAYLOAD_ASYNC_WORKERS:-2}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - spool:/app/data/spool
    deploy:
      resources:
        limits:
          memory: 1g        # streaming keeps memory flat even for 500MB feeds

  adminer:
    image: adminer:4
    container_name: telecom-cdr-adminer
    profiles: ["tools"]
    depends_on: [mysql]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"

volumes:
  mysql-data:
  spool:
