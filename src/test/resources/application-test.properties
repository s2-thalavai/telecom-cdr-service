# Test profile: in-memory H2 and deliberately SMALL limits so size rules are cheap to exercise
spring.datasource.url=jdbc:h2:mem:cdrtest;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

telecom.payload.default-max-request-size=64KB
telecom.payload.streaming-max-request-size=2MB
telecom.payload.max-decompressed-size=4MB
telecom.payload.chunk-size=50
telecom.payload.max-records-per-request=5000
telecom.payload.max-reported-errors=10
telecom.payload.async-workers=1
telecom.payload.async-queue-capacity=2
# telecom.payload.spool-directory is set per test class (temp directory)

server.tomcat.max-swallow-size=20MB
logging.level.com.telecom=INFO
