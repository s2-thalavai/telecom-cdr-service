# PROD: MySQL; rewriteBatchedStatements turns JDBC batches into multi-row INSERTs
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:telecomdb}?rewriteBatchedStatements=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:telecom_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false
logging.level.com.telecom=INFO
