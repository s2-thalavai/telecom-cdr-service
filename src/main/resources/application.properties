# =====================================================================
# Common configuration. Profiles: dev (default, H2), prod (MySQL + Flyway), test (tests)
# =====================================================================
spring.application.name=telecom-cdr-service
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}

# ---------- Embedded Tomcat ----------
# NOTE: Tomcat/Spring have NO size limit for JSON bodies -> telecom.payload.* + RequestSizeLimitFilter
server.tomcat.max-swallow-size=10MB
server.tomcat.max-http-form-post-size=2MB
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=120s
server.tomcat.keep-alive-timeout=60s
server.tomcat.max-connections=8192
server.tomcat.accept-count=200
server.tomcat.threads.max=200
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=60s

# Java 21 virtual threads: blocking body reads don't pin platform threads
spring.threads.virtual.enabled=true
spring.mvc.async.request-timeout=120s

# Compress large responses (paged listings)
server.compression.enabled=true
server.compression.mime-types=application/json,application/x-ndjson,application/problem+json
server.compression.min-response-size=2KB

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ---------- Jackson ----------
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Paging: bound large responses ----------
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=500

spring.mvc.problemdetails.enabled=true

# ---------- JPA / JDBC ----------
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jdbc.template.fetch-size=500
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# ---------- Application payload settings (PayloadProperties) ----------
telecom.payload.default-max-request-size=10MB
telecom.payload.streaming-max-request-size=500MB
telecom.payload.max-decompressed-size=2GB
telecom.payload.streaming-paths=/api/v1/cdrs/stream,/api/v1/cdrs/async
telecom.payload.chunk-size=1000
telecom.payload.max-records-per-request=5000000
telecom.payload.max-reported-errors=100
telecom.payload.spool-directory=${TELECOM_SPOOL_DIRECTORY:./data/spool}
telecom.payload.async-workers=2
telecom.payload.async-queue-capacity=20

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
